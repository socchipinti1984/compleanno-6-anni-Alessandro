<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Il Mio Invito Digitale</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        /* Contenitore principale del video a tutto schermo */
        .video-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            pointer-events: none; /* Impedisce la comparsa delle barre native dello smartphone al tocco */
        }
        /* Overlay invisibile per i pulsanti cliccabili */
        .interactive-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            padding-bottom: 8%; /* Distanza dal fondo per posizionare le aree cliccabili */
        }
        /* Stile delle aree cliccabili invisibili ma perfettamente posizionate */
        .clickable-area {
            display: block;
            width: 85%;
            max-width: 400px;
            height: 60px; /* Altezza dell'area di tocco per lo smartphone */
            margin: 10px 0;
            cursor: pointer;
            text-decoration: none;
            -webkit-tap-highlight-color: rgba(0,0,0,0); /* Rimuove il flash brutto su iPhone al tocco */
            /* Per testare il posizionamento puoi aggiungere un bordo temporaneo disattivando le righe sotto */
            background: transparent;
            border: none;
        }
    </style>
</head>
<body>

    <div class="video-container">
        <!-- Istruzioni per l'Autoplay: il video DEVE essere in "muted" per partire da solo su smartphone, 
             l'utente attiverà l'audio toccando lo schermo o tramite le impostazioni del telefono -->
        <video id="bg-video" autoplay loop muted playsinline webkit-playsinline>
            <source src="video.mp4" type="video/mp4">
            Il tuo browser non supporta i video HTML5.
        </video>
    </div>

    <!-- Questa è la griglia invisibile che cattura i click esattamente dove serve -->
    <div class="interactive-overlay">
        <!-- Area Cliccabile che corrisponde alla scritta "UNISCITI A NOI!" per il Google Form -->
        <a href="https://drive.google.com/file/d/1U-oMwhFrR7L6TRi3aoo3ok8Sp1xlZFaq/view?usp=drive_link" target="_blank" class="clickable-area" title="Rsvp Google Form"></a>
        
        <!-- Area Cliccabile che corrisponde alla scritta "GIARDINO DELLE MERAVIGLIE..." per Google Maps -->
        <a href="https://maps.google.com/?q=Giardino+delle+Meraviglie+Viale+del+Fante+66+Palermo" target="_blank" class="clickable-area" title="Mappa Google Maps"></a>
    </div>

    <script>
        // Trucco JavaScript per forzare l'avvio dell'autoplay anche su browser mobili molto restrittivi
        document.addEventListener('DOMContentLoaded', function() {
            var video = document.getElementById('bg-video');
            video.play().catch(function(error) {
                console.log("Autoplay bloccato dal browser. Richiede interazione dell'utente.");
                // Se bloccato, il primo tocco sullo schermo farà partire il video
                document.body.addEventListener('click', function() {
                    video.play();
                }, { once: true });
            });
        });
    </script>

</body>
</html>
