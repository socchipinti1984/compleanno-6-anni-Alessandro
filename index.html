<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Il Mio Invito Digitale</title>
    <style>
        /* Resetta i margini ed evita qualsiasi tipo di scorrimento */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: sans-serif;
        }

        /* Contenitore principale reattivo che si adatta allo schermo del telefono */
        .invitation-container {
            position: relative;
            width: 100%;
            height: 100%;
            max-width: 500px; /* Larghezza ideale per simulare lo smartphone anche da PC */
            margin: 0 auto;
            overflow: hidden;
        }

        /* Il video si adatta perfettamente ai bordi senza deformarsi */
        video {
            width: 100%;
            height: 100%;
            object-fit: cover; /* Taglia leggermente i bordi se lo schermo è strano, ma riempie sempre la pagina */
            display: block;
        }

        /* AREE CLICCABILI INVISIBILI (Mappa e Form) */
        .clickable-link {
            position: absolute;
            left: 5%;
            width: 90%;
            display: block;
            text-decoration: none;
            cursor: pointer;
            z-index: 10;
            /* Rendi i blocchi visibili in rosso durante i test cambiando 'transparent' con 'rgba(255,0,0,0.3)' */
            background-color: transparent; 
        }

        /* 1. Area per l'RSVP ("UNISCITI A NOI!") */
        #rsvp-trigger {
            top: 65%;    /* Regola questa percentuale per alzare o abbassare il click */
            height: 8%;  /* Regola questa percentuale per fare l'area più o meno alta */
        }

        /* 2. Area per la Mappa ("GIARDINO DELLE MERAVIGLIE...") */
        #maps-trigger {
            top: 78%;    /* Regola questa percentuale per posizionarla sopra la scritta del luogo */
            height: 10%; /* Altezza dell'area del click per l'indirizzo */
        }
    </style>
</head>
<body>

    <div class="invitation-container">
        <!-- Il video parte in automatico, mutato (obbligatorio su mobile), in loop e senza barre -->
        <video autoplay muted loop playsinline id="myVideo">
            <source src="video.mp4" type="video/mp4">
            Il tuo browser non supporta i video HTML5.
        </video>

        <!-- Area cliccabile 1: Incolla il link del tuo Google Form tra le virgolette di href -->
        <a href="https://docs.google.com/forms/d/e/1FAIpQLSdJJdV21h68GCbCCDC8KqS20Ar9o6fWLq4n0ucZwTMxRcD_DA/viewform?usp=header" class="clickable-link" id="rsvp-trigger"></a>

        <!-- Area cliccabile 2: Mappa del Giardino delle Meraviglie a Palermo (Già configurata) -->
        <a href="https://maps.app.goo.gl/yVVNXgNpjaUY199G9" class="clickable-link" id="maps-trigger"></a>
    </div>

    <script>
        // Forza l'avvio del video nel caso in cui alcuni telefoni provino a bloccarlo
        document.addEventListener('DOMContentLoaded', function() {
            var video = document.getElementById('myVideo');
            video.play().catch(function(error) {
                console.log("Riproduzione automatica bloccata, in attesa di interazione.");
            });
        });
    </script>

</body>
</html>
