<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Il Mio Invito Digitale</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Il contenitore mantiene SEMPRE la proporzione verticale 9:16, sia dritto che storto */
        .invitation-container {
            position: relative;
            width: 100%;
            height: 100%;
            aspect-ratio: 9 / 16;
            max-height: 100vh;
            max-width: calc(100vh * 9 / 16);
            background-color: #000;
            overflow: hidden;
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            pointer-events: none; /* Impedisce al lettore video nativo del telefono di rubare il clic */
        }

        /* Schermata iniziale per sbloccare l'audio obbligatorio */
        #audio-unlock-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            z-index: 999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #fff;
            text-align: center;
            font-family: sans-serif;
            padding: 20px;
            cursor: pointer;
        }
        .unlock-btn {
            background-color: #fff;
            color: #000;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 30px;
            margin-top: 20px;
            cursor: pointer;
        }

        /* AREE CLICCABILI INVISIBILI (Usano le percentuali fisse sul contenitore 9:16) */
        .clickable-area {
            position: absolute;
            left: 5%;
            width: 90%;
            z-index: 99; /* Valore altissimo per stare sopra a tutto e intercettare il tocco */
            text-decoration: none;
            background-color: rgba(255, 0, 0, 0.3); /* <--- ORA È IN ROSSO PER VEDERLA. Cambia in 'transparent' alla fine */
        }

        /* 1. Area sopra "UNISCITI A NOI!" */
        #rsvp-trigger {
            top: 90%;    /* Modifica questa percentuale per alzare/abbassare il rettangolo */
            height: 8%;  /* Spessore del rettangolo del click */
        }

        /* 2. Area sopra la Mappa */
        #maps-trigger {
            top: 73%;    /* Modifica questa percentuale per alzare/abbassare il rettangolo */
            height: 15%; /* Spessore del rettangolo del click */
        }
    </style>
</head>
<body>

    <div class="invitation-container">
        <!-- Schermata di avvio -->
        <div id="audio-unlock-overlay" onclick="startInvitation()">
            <h2>✨ Ti hanno invitato a una festa! ✨</h2>
            <p style="margin-top: 10px; opacity: 0.8;">Tocca per aprire l'invito con la musica</p>
            <button class="unlock-btn">APRI INVITO 🎶</button>
        </div>

        <video id="myVideo" loop playsinline muted>
            <source src="video.mp4" type="video/mp4">
            Il tuo browser non supporta i video HTML5.
        </video>

        <!-- Area 1: SOSTITUISCI 'LINK_DEL_TUO_GOOGLE_FORM' CON IL TUO LINK REALE -->
        <a href="https://docs.google.com/forms/d/e/1FAIpQLSdJJdV21h68GCbCCDC8KqS20Ar9o6fWLq4n0ucZwTMxRcD_DA/viewform?usp=header" target="_blank" class="clickable-area" id="rsvp-trigger"></a>

        <!-- Area 2: Mappa del Giardino delle Meraviglie a Palermo -->
        <a href="https://maps.app.goo.gl/yVVNXgNpjaUY199G9" target="_blank" class="clickable-area" id="maps-trigger"></a>
    </div>

    <script>
        function startInvitation() {
            var video = document.getElementById('myVideo');
            var overlay = document.getElementById('audio-unlock-overlay');
            overlay.style.display = 'none';
            video.muted = false;
            video.play().catch(function(error) {
                console.log("Riproduzione fallita:", error);
            });
        }
    </script>

</body>
</html>
