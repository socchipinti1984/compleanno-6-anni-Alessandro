<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Il Mio Invito Digitale</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
        }
        .invitation-container {
            position: relative;
            width: 100%;
            height: 100%;
            max-width: 500px;
            margin: 0 auto;
            overflow: hidden;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* Schermata iniziale pulita per sbloccare la musica obbligatoria su mobile */
        #audio-unlock-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            z-index: 999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #fff;
            text-align: center;
            font-family: sans-serif;
            padding: 20px;
            cursor: pointer;
        }
        .unlock-btn {
            background-color: #fff;
            color: #000;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 30px;
            margin-top: 20px;
            box-shadow: 0 4px 15px rgba(255,255,255,0.3);
        }

        /* AREE CLICCABILI INVISIBILI SOPRA IL VIDEO */
        .clickable-area {
            position: absolute;
            left: 5%;
            width: 90%;
            display: block;
            z-index: 10;
            background-color: transparent; /* Cambia in 'rgba(255,0,0,0.3)' se vuoi vederle in rosso per fare i test */
        }

        /* 1. Area sopra la scritta "UNISCITI A NOI!" */
        #rsvp-trigger {
            top: 65%;    /* Modifica questa percentuale se devi alzarla o abbassarla */
            height: 8%;  /* Altezza dell'area del click */
        }

        /* 2. Area sopra la scritta del luogo "GIARDINO DELLE MERAVIGLIE..." */
        #maps-trigger {
            top: 78%;    /* Modifica questa percentuale se devi alzarla o abbassarla */
            height: 10%; /* Altezza dell'area del click */
        }
    </style>
</head>
<body>

    <div class="invitation-container">
        <!-- Schermata di avvio obbligatoria per attivare l'audio -->
        <div id="audio-unlock-overlay" onclick="startInvitation()">
            <h2>✨ Ti hanno invitato a una festa! ✨</h2>
            <p style="margin-top: 10px; opacity: 0.8;">Tocca per aprire l'invito con la musica</p>
            <button class="unlock-btn">APRI INVITO 🎶</button>
        </div>

        <!-- Il video parte mutato per superare i blocchi dei telefoni -->
        <video id="myVideo" loop playsinline muted>
            <source src="video.mp4" type="video/mp4">
            Il tuo browser non supporta i video HTML5.
        </video>

        <!-- Area Invisibile 1: Inserisci il link del Google Form tra le virgolette di href -->
        <a href="https://docs.google.com/forms/d/e/1FAIpQLSdJJdV21h68GCbCCDC8KqS20Ar9o6fWLq4n0ucZwTMxRcD_DA/viewform?usp=header" class="clickable-area" id="rsvp-trigger"></a>

        <!-- Area Invisibile 2: Mappa del Giardino delle Meraviglie a Palermo -->
        <a href="https://maps.app.goo.gl/yVVNXgNpjaUY199G9" class="clickable-area" id="maps-trigger"></a>
    </div>

    <script>
        function startInvitation() {
            var video = document.getElementById('myVideo');
            var overlay = document.getElementById('audio-unlock-overlay');
            
            // Nasconde la schermata di sblocco
            overlay.style.display = 'none';
            
            // Attiva l'audio e avvia il video
            video.muted = false;
            video.play().catch(function(error) {
                console.log("Riproduzione fallita:", error);
            });
        }
    </script>

</body>
</html>
